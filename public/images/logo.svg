<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="geometricPrecision">
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0369a1"/>

  <!-- Subtle inner glow ring -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4"/>

  <!-- Recycling / cycle arrow circle (teal-green) -->
  <!-- Arc 1: top-right (~30° to 150°), arrow pointing clockwise -->
  <path
    d="M 32 10
       A 22 22 0 0 1 51.1 43"
    fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrowhead for arc 1 -->
  <polygon points="51.1,43 44,39 55,37" fill="#34d399"/>

  <!-- Arc 2: bottom (~150° to 270°), arrow pointing clockwise -->
  <path
    d="M 51.1 43
       A 22 22 0 0 1 12.9 43"
    fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrowhead for arc 2 -->
  <polygon points="12.9,43 20,47 9,45" fill="#34d399"/>

  <!-- Arc 3: left (~270° to 390°/30°), arrow pointing clockwise -->
  <path
    d="M 12.9 43
       A 22 22 0 0 1 32 10"
    fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrowhead for arc 3 -->
  <polygon points="32,10 35,18 28,18" fill="#34d399"/>

  <!-- Medical cross (white, centered) -->
  <!-- Vertical bar -->
  <rect x="27" y="20" width="10" height="24" rx="2.5" fill="white"/>
  <!-- Horizontal bar -->
  <rect x="20" y="27" width="24" height="10" rx="2.5" fill="white"/>
</svg>